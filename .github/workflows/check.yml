name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # llm-agents.nix declares this cache in nixConfig, which Nix ignores
          # as untrusted; without it codex is rebuilt from source.
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Flake checks (formatting + home-manager)
        run: nix flake check --print-build-logs --no-update-lock-file

      - name: Evaluate NixOS system (legion)
        run: |
          nix build --dry-run --print-build-logs --no-update-lock-file \
            '.#nixosConfigurations.sebastian-laptop-legion.config.system.build.toplevel'
